name: Tests

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    # Gibt der Action das Recht, Code-Änderungen in das Repo zurückzuschreiben
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Install dependencies
        run: |
          uv venv --python '3.12'
          source .venv/bin/activate
          uv pip install -e ".[dev,ai]"

      - name: Run ruff
        run: uv run ruff check .

      # Korrigiert die Formatierung statt nur zu prüfen
      - name: Run black
        run: uv run black .

      # Sortiert die Imports statt nur zu prüfen
      - name: Run isort
        run: uv run isort .

      # Erkennt Änderungen und pusht sie automatisch zurück in den Branch
      - name: Auto-commit format fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: Automatische Code-Formatierung durch GitHub Action"
